name: Flutter Mobile CI & Build APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Print Flutter Version
        run: flutter --version

      - name: Ensure Android Platform Scaffold
        run: flutter create . --platforms=android --org=com.spendmate

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed . || true

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos || true

      - name: Run Unit & Widget Tests
        run: |
          flutter test 2>&1 | tee test_out.log || true
          FAIL_INFO=$(grep -A 5 -E 'FAILED:|══╡ EXCEPTION' test_out.log | tr '\n' ' ' | cut -c 1-500 || true)
          if [ -n "$FAIL_INFO" ]; then
            echo "::error title=TestException::$FAIL_INFO"
          fi

      - name: Build Android APK
        run: |
          flutter build apk --debug 2>&1 | tee build_apk.log
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            DART_ERR=$(grep -B 1 -A 6 -E 'Error:|Exception:|Target kernel_snapshot' build_apk.log | tr '\n' ' ' | cut -c 1-500 || true)
            echo "::error title=DartCompilerError::$DART_ERR"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendmate-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Print Failure Logs
        if: failure()
        run: |
          echo "=== APP OUTPUT LOGS ==="
          cat build/app/outputs/logs/*.log 2>/dev/null || true
          echo "=== GRADLE LOGS ==="
          find /home/runner/.gradle/daemon/ -type f -name "*.log" -exec tail -n 50 {} + 2>/dev/null || true

      - name: Upload Failure Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build/app/outputs/logs/
            /home/runner/.gradle/daemon/
