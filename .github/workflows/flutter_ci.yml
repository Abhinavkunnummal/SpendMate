name: Flutter Mobile CI & Build APK

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:'

      - name: Print Flutter Version
        run: flutter --version

      - name: Ensure Android Platform Scaffold
        run: flutter create . --platforms=android --org=com.spendmate

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed . || true

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test || true

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendmate-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
